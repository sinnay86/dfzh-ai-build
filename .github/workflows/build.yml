name: Build DFZH-AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"
  VCPKG_COMMIT: "2024.07.12"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout DFZH-AI source
      # ============================================================
      - name: Checkout DFZH-AI source
        uses: actions/checkout@v4
        with:
          path: dfzh-source


      # ============================================================
      # 2. Checkout DFHack 53.06-r1
      # ============================================================
      - name: Checkout DFHack source
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            --branch %DFHACK_VERSION% ^
            --recurse-submodules ^
            --shallow-submodules ^
            https://github.com/DFHack/dfhack.git ^
            dfhack


      # ============================================================
      # 3. Verify DFHack dependencies
      # ============================================================
      - name: Verify DFHack
        shell: cmd
        run: |
          cd dfhack

          echo ========================================
          echo DFHack version
          echo ========================================

          git rev-parse HEAD

          echo.
          git describe --tags --always

          echo.
          echo ========================================
          echo Checking dependencies
          echo ========================================

          if not exist depends\dfhooks\CMakeLists.txt (
            echo ERROR: dfhooks missing
            exit /b 1
          )

          if not exist depends\googletest\CMakeLists.txt (
            echo ERROR: googletest missing
            exit /b 1
          )

          if not exist depends\jsoncpp-sub\CMakeLists.txt (
            echo ERROR: jsoncpp missing
            exit /b 1
          )

          if not exist depends\clsocket\CMakeLists.txt (
            echo ERROR: clsocket missing
            exit /b 1
          )

          if not exist depends\libzip\CMakeLists.txt (
            echo ERROR: libzip missing
            exit /b 1
          )

          if not exist depends\xlsxio\CMakeLists.txt (
            echo ERROR: xlsxio missing
            exit /b 1
          )

          if not exist depends\libexpat\expat (
            echo ERROR: libexpat missing
            exit /b 1
          )

          echo.
          echo DFHack dependencies OK.


      # ============================================================
      # 4. Check Visual Studio
      # ============================================================
      - name: Check Visual Studio
        shell: cmd
        run: |
          echo ========================================
          echo Visual Studio
          echo ========================================

          where vswhere

          echo.
          echo Installed Visual Studio:

          vswhere -latest ^
            -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath

          echo.
          echo Checking MSBuild:

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          if not defined VS_PATH (
            echo ERROR: Visual Studio not found
            exit /b 1
          )

          echo VS_PATH=%VS_PATH%

          if not exist "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" (
            echo ERROR: MSBuild not found
            exit /b 1
          )

          "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" -version


      # ============================================================
      # 5. Install vcpkg
      # ============================================================
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            --branch %VCPKG_COMMIT% ^
            https://github.com/microsoft/vcpkg.git ^
            vcpkg

          cd vcpkg

          call bootstrap-vcpkg.bat


      # ============================================================
      # 6. Cache vcpkg
      # ============================================================
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-dfzh-${{ runner.os }}-${{ VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-dfzh-${{ runner.os }}-


      # ============================================================
      # 7. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          cd vcpkg

          vcpkg install ^
            detours:x64-windows ^
            spdlog:x64-windows ^
            tomlplusplus:x64-windows


      # ============================================================
      # 8. Extract data.zip
      # ============================================================
      - name: Extract data.zip
        shell: cmd
        run: |
          cd dfzh-source

          tar -xf data.zip


      # ============================================================
      # 9. Copy DFZH to DFHack external plugin
      # ============================================================
      - name: Copy DFZH to DFHack
        shell: cmd
        run: |

          if exist dfhack\plugins\external\dfzh (
            rmdir /S /Q dfhack\plugins\external\dfzh
          )

          mkdir dfhack\plugins\external\dfzh

          copy /Y ^
            dfzh-source\CMakeLists.txt ^
            dfhack\plugins\external\dfzh\CMakeLists.txt

          xcopy /E /I /Y ^
            dfzh-source\dfzh ^
            dfhack\plugins\external\dfzh\dfzh

          xcopy /E /I /Y ^
            dfzh-source\data ^
            dfhack\plugins\external\dfzh\data

          xcopy /E /I /Y ^
            dfzh-source\3rdParty ^
            dfhack\plugins\external\dfzh\3rdParty


      # ============================================================
      # 10. Verify DFZH source
      # ============================================================
      - name: Verify DFZH source
        shell: cmd
        run: |

          echo ========================================
          echo DFZH source
          echo ========================================

          dir /s /b dfhack\plugins\external\dfzh

          echo.
          echo ========================================
          echo Checking obsolete API references
          echo ========================================

          findstr /S /I /N ^
            "MemoryPatcher.h Hotkey.h getHotkeyManager" ^
            dfhack\plugins\external\dfzh\*.cpp ^
            dfhack\plugins\external\dfzh\*.h ^
            2>nul || echo No obsolete DFHack API references found.


      # ============================================================
      # 11. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: cmd
        run: |

          cd dfhack

          if exist build (
            rmdir /S /Q build
          )

          mkdir build

          cd build

          cmake .. ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=..\..\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF


      # ============================================================
      # 12. Verify generated DFZH project
      # ============================================================
      - name: Verify generated DFZH project
        shell: cmd
        run: |

          echo ========================================
          echo Generated DFZH project
          echo ========================================

          dir /s /b dfhack\build\*dfzh*.vcxproj

          if not exist dfhack\build\plugins\external\dfzh\dfzh.vcxproj (
            echo ERROR: dfzh.vcxproj was not generated
            exit /b 1
          )


      # ============================================================
      # 13. Build DFZH
      # ============================================================
      - name: Build DFZH
        shell: cmd
        run: |

          cd dfhack\build

          cmake --build . ^
            --config Release ^
            --target dfzh ^
            -- /m


      # ============================================================
      # 14. Find DLL
      # ============================================================
      - name: Find DFZH DLL
        shell: cmd
        run: |

          echo ========================================
          echo Searching for dfzh.plug.dll
          echo ========================================

          dir /s /b dfhack\build\dfzh.plug.dll 2>nul

          dir /s /b dfhack\build\*.dll


      # ============================================================
      # 15. Create release package
      # ============================================================
      - name: Create release package
        shell: cmd
        run: |

          if exist release-package (
            rmdir /S /Q release-package
          )

          mkdir release-package
          mkdir release-package\plugins
          mkdir release-package\data
          mkdir release-package\data\dfzh

          set "FOUND_DLL="

          for /r "dfhack\build" %%F in (dfzh.plug.dll) do (
            if not defined FOUND_DLL (
              set "FOUND_DLL=%%F"
              copy /Y "%%F" "release-package\plugins\dfzh.plug.dll"
            )
          )

          if not defined FOUND_DLL (
            echo ERROR: dfzh.plug.dll not found
            exit /b 1
          )

          xcopy /E /I /Y ^
            dfzh-source\data\* ^
            release-package\data\dfzh\

          echo.
          echo ========================================
          echo Release package
          echo ========================================

          dir /s /b release-package


      # ============================================================
      # 16. Upload artifact
      # ============================================================
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package
          if-no-files-found: error
