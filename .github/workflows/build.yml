name: Build DFZH-AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout DFZH source
      # ============================================================
      - name: Checkout dfzh source
        uses: actions/checkout@v4
        with:
          path: dfzh-source


      # ============================================================
      # 2. Checkout DFHack
      #    Download ALL DFHack submodules.
      # ============================================================
      - name: Checkout DFHack source
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            --branch %DFHACK_VERSION% ^
            --recurse-submodules ^
            --shallow-submodules ^
            https://github.com/DFHack/dfhack.git ^
            dfhack


      # ============================================================
      # 3. Verify DFHack submodules
      # ============================================================
      - name: Verify DFHack submodules
        shell: cmd
        run: |
          cd dfhack

          echo ========================================
          echo DFHack commit
          echo ========================================

          git rev-parse HEAD

          echo.
          echo ========================================
          echo Submodule status
          echo ========================================

          git submodule status

          echo.
          echo ========================================
          echo Checking required directories
          echo ========================================

          if not exist depends\dfhooks\CMakeLists.txt (
            echo ERROR: dfhooks submodule is missing.
            exit /b 1
          )

          if not exist depends\googletest\CMakeLists.txt (
            echo ERROR: googletest submodule is missing.
            exit /b 1
          )

          if not exist depends\jsoncpp-sub\CMakeLists.txt (
            echo ERROR: jsoncpp submodule is missing.
            exit /b 1
          )

          if not exist depends\clsocket\CMakeLists.txt (
            echo ERROR: clsocket submodule is missing.
            exit /b 1
          )

          if not exist depends\libzip\CMakeLists.txt (
            echo ERROR: libzip submodule is missing.
            exit /b 1
          )

          if not exist depends\xlsxio\CMakeLists.txt (
            echo ERROR: xlsxio submodule is missing.
            exit /b 1
          )

          if not exist depends\libexpat\expat (
            echo ERROR: libexpat submodule is missing.
            exit /b 1
          )

          if not exist scripts\CMakeLists.txt (
            echo ERROR: DFHack scripts directory is missing.
            exit /b 1
          )

          echo.
          echo All required DFHack submodules are present.


      # ============================================================
      # 4. Locate Visual Studio
      # ============================================================
      - name: Locate Visual Studio
        shell: cmd
        run: |
          echo ========================================
          echo Visual Studio
          echo ========================================

          where vswhere

          echo.
          echo Installed Visual Studio:

          vswhere -latest ^
            -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath

          echo.
          echo MSBuild:

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          if not defined VS_PATH (
            echo ERROR: Visual Studio installation not found.
            exit /b 1
          )

          echo VS_PATH=%VS_PATH%

          if exist "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" (
            echo MSBuild found.
          ) else (
            echo ERROR: MSBuild.exe not found.
            exit /b 1
          )


      # ============================================================
      # 5. Check MSVC toolchain
      # ============================================================
      - name: Check MSVC toolchain
        shell: cmd
        run: |
          echo ========================================
          echo MSVC toolchain
          echo ========================================

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          echo Visual Studio:
          echo %VS_PATH%

          echo.
          echo Installed MSVC versions:

          dir /b "%VS_PATH%\VC\Tools\MSVC"

          echo.
          echo Compiler versions:

          for /d %%D in ("%VS_PATH%\VC\Tools\MSVC\*") do (
            echo ----------------------------------------
            echo %%D
            "%%D\bin\Hostx64\x64\cl.exe" 2>&1 | findstr /C:"Version"
          )


      # ============================================================
      # 6. Install vcpkg
      # ============================================================
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

          cd vcpkg

          call bootstrap-vcpkg.bat


      # ============================================================
      # 7. Cache vcpkg
      # ============================================================
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-dfzh-${{ runner.os }}-x64-${{ github.run_id }}
          restore-keys: |
            vcpkg-dfzh-${{ runner.os }}-x64-


      # ============================================================
      # 8. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          cd vcpkg

          vcpkg install ^
            detours:x64-windows ^
            spdlog:x64-windows ^
            tomlplusplus:x64-windows


      # ============================================================
      # 9. Extract data.zip
      # ============================================================
      - name: Extract data.zip
        shell: cmd
        run: |
          cd dfzh-source

          tar -xf data.zip


      # ============================================================
      # 10. Copy DFZH into DFHack
      # ============================================================
      - name: Copy dfzh to DFHack
        shell: cmd
        run: |
          if not exist dfhack\plugins\df_chinese mkdir dfhack\plugins\df_chinese

          copy /Y ^
            dfzh-source\CMakeLists.txt ^
            dfhack\plugins\df_chinese\CMakeLists.txt

          xcopy /E /I /Y ^
            dfzh-source\dfzh ^
            dfhack\plugins\df_chinese\dfzh

          xcopy /E /I /Y ^
            dfzh-source\data ^
            dfhack\plugins\df_chinese\data

          xcopy /E /I /Y ^
            dfzh-source\3rdParty ^
            dfhack\plugins\df_chinese\3rdParty


      # ============================================================
      # 11. Verify DFZH source
      # ============================================================
      - name: Verify plugin source
        shell: cmd
        run: |
          echo ========================================
          echo DFZH plugin source
          echo ========================================

          dir /s /b dfhack\plugins\df_chinese


      # ============================================================
      # 12. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: cmd
        run: |
          cd dfhack

          if exist build rmdir /S /Q build

          mkdir build

          cd build

          cmake .. ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=..\..\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF


      # ============================================================
      # 13. List CMake build targets
      #
      # IMPORTANT:
      # Do NOT assume the plugin target is named "dfzh".
      # ============================================================
      - name: List build targets
        shell: cmd
        run: |
          cd dfhack\build

          echo ========================================
          echo Available CMake targets
          echo ========================================

          cmake --build . --config Release --target help


      # ============================================================
      # 14. Upload CMake logs / build information
      # ============================================================
      - name: Show generated project files
        shell: cmd
        run: |
          echo ========================================
          echo Generated Visual Studio projects
          echo ========================================

          dir /s /b dfhack\build\*.vcxproj

          echo.
          echo ========================================
          echo DFZH related files
          echo ========================================

          dir /s /b dfhack\build\*dfzh* 2>nul

          echo.
          echo ========================================
          echo DF Chinese related files
          echo ========================================

          dir /s /b dfhack\build\*df_chinese* 2>nul
