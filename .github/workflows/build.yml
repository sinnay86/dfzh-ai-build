name: Build DFZH-AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout DFZH-AI
      # ============================================================
      - name: Checkout DFZH-AI source
        uses: actions/checkout@v4
        with:
          path: dfzh-source


      # ============================================================
      # 2. Checkout exact DFHack version
      # ============================================================
      - name: Checkout DFHack source
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            --branch %DFHACK_VERSION% ^
            --recurse-submodules ^
            --shallow-submodules ^
            https://github.com/DFHack/dfhack.git ^
            dfhack


      # ============================================================
      # 3. Verify DFHack dependencies
      # ============================================================
      - name: Verify DFHack dependencies
        shell: cmd
        run: |
          echo ========================================
          echo DFHack version
          echo ========================================

          cd dfhack

          git rev-parse HEAD
          git describe --tags --always

          echo.
          echo ========================================
          echo Checking DFHack submodules
          echo ========================================

          if not exist depends\dfhooks\CMakeLists.txt (
            echo ERROR: dfhooks missing
            exit /b 1
          )

          if not exist depends\googletest\CMakeLists.txt (
            echo ERROR: googletest missing
            exit /b 1
          )

          if not exist depends\jsoncpp-sub\CMakeLists.txt (
            echo ERROR: jsoncpp missing
            exit /b 1
          )

          if not exist depends\clsocket\CMakeLists.txt (
            echo ERROR: clsocket missing
            exit /b 1
          )

          if not exist depends\libzip\CMakeLists.txt (
            echo ERROR: libzip missing
            exit /b 1
          )

          if not exist depends\xlsxio\CMakeLists.txt (
            echo ERROR: xlsxio missing
            exit /b 1
          )

          if not exist depends\libexpat\expat (
            echo ERROR: libexpat missing
            exit /b 1
          )

          echo.
          echo DFHack dependencies OK.


      # ============================================================
      # 4. Install current vcpkg
      #
      # IMPORTANT:
      # Do NOT pin vcpkg to the old 2024.07.12 version.
      #
      # The old vcpkg tries to download an obsolete MSYS2 pkgconf
      # archive while building fmt.
      # ============================================================
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone ^
            https://github.com/microsoft/vcpkg.git ^
            vcpkg

          cd vcpkg

          call bootstrap-vcpkg.bat -disableMetrics

          if not exist vcpkg.exe (
            echo ERROR: vcpkg.exe was not created
            exit /b 1
          )

          vcpkg version


      # ============================================================
      # 5. Cache DFZH manifest dependencies
      # ============================================================
      - name: Cache DFZH vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            dfzh-source/3rdParty/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
          key: dfzh-vcpkg-${{ runner.os }}-${{ hashFiles('dfzh-source/3rdParty/vcpkg.json') }}
          restore-keys: |
            dfzh-vcpkg-${{ runner.os }}-


      # ============================================================
      # 6. Install DFZH dependencies through manifest mode
      #
      # vcpkg.json already defines:
      #   detours
      #   spdlog
      #   tomlplusplus
      #
      # The install directory becomes:
      #
      # dfzh-source/
      #   3rdParty/
      #     vcpkg_installed/
      #       x64-windows/
      #
      # which is exactly what CMakeLists.txt expects.
      # ============================================================
      - name: Install DFZH dependencies
        shell: cmd
        run: |
          cd dfzh-source\3rdParty

          echo ========================================
          echo DFZH vcpkg manifest
          echo ========================================

          type vcpkg.json

          echo.
          echo ========================================
          echo Installing dependencies
          echo ========================================

          ..\..\vcpkg\vcpkg.exe install ^
            --triplet x64-windows ^
            --disable-metrics

          if not exist vcpkg_installed\x64-windows\include (
            echo ERROR: vcpkg dependencies were not installed
            exit /b 1
          )

          echo.
          echo ========================================
          echo Installed packages
          echo ========================================

          dir /b vcpkg_installed\x64-windows


      # ============================================================
      # 7. Extract data.zip
      # ============================================================
      - name: Extract data.zip
        shell: cmd
        run: |
          cd dfzh-source

          if not exist data.zip (
            echo ERROR: data.zip not found
            exit /b 1
          )

          tar -xf data.zip

          if not exist data (
            echo ERROR: data directory was not extracted
            exit /b 1
          )


      # ============================================================
      # 8. Copy DFZH into DFHack external plugin tree
      # ============================================================
      - name: Copy DFZH to DFHack
        shell: cmd
        run: |

          if exist dfhack\plugins\external\dfzh (
            rmdir /S /Q dfhack\plugins\external\dfzh
          )

          mkdir dfhack\plugins\external\dfzh

          copy /Y ^
            dfzh-source\CMakeLists.txt ^
            dfhack\plugins\external\dfzh\CMakeLists.txt

          xcopy /E /I /Y ^
            dfzh-source\dfzh ^
            dfhack\plugins\external\dfzh\dfzh

          xcopy /E /I /Y ^
            dfzh-source\data ^
            dfhack\plugins\external\dfzh\data

          xcopy /E /I /Y ^
            dfzh-source\3rdParty ^
            dfhack\plugins\external\dfzh\3rdParty


      # ============================================================
      # 9. Verify DFZH dependencies
      # ============================================================
      - name: Verify DFZH dependencies
        shell: cmd
        run: |
          echo ========================================
          echo Checking DFZH vcpkg installation
          echo ========================================

          if not exist "dfhack\plugins\external\dfzh\3rdParty\vcpkg_installed\x64-windows\include" (
            echo ERROR: DFZH vcpkg include directory missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\3rdParty\vcpkg_installed\x64-windows\include\detours\detours.h" (
            echo ERROR: Detours headers missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\3rdParty\vcpkg_installed\x64-windows\include\spdlog\spdlog.h" (
            echo ERROR: spdlog headers missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\3rdParty\vcpkg_installed\x64-windows\include\toml++\toml.hpp" (
            echo ERROR: toml++ headers missing
            exit /b 1
          )

          echo.
          echo DFZH dependencies OK.

      # ============================================================
      # 10. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: cmd
        run: |

          cd dfhack

          if exist build (
            rmdir /S /Q build
          )

          mkdir build

          cd build

          cmake .. ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF


      # ============================================================
      # 11. Verify generated DFZH project
      # ============================================================
           - name: Verify generated DFZH project
        shell: cmd
        run: |

          echo ========================================
          echo DFZH project
          echo ========================================

          dir /s /b ^
            dfhack\build\plugins\external\dfzh\dfzh.vcxproj

          if not exist "dfhack\build\plugins\external\dfzh\dfzh.vcxproj" (
            echo ERROR: dfzh.vcxproj was not generated
            exit /b 1
          )

          echo.
          echo DFZH project generated successfully.


      # ============================================================
      # 12. Build DFZH
      # ============================================================
      - name: Build DFZH
        shell: cmd
        run: |

          cd dfhack\build

          cmake --build . ^
            --config Release ^
            --target dfzh ^
            -- /m


      # ============================================================
      # 13. Find DFZH DLL
      # ============================================================
      - name: Find DFZH DLL
        shell: cmd
        run: |

          echo ========================================
          echo Searching for DFZH DLL
          echo ========================================

          dir /s /b ^
            dfhack\build\dfzh.plug.dll ^
            2>nul

          dir /s /b ^
            dfhack\build\*.dll


      # ============================================================
      # 14. Create release package
      # ============================================================
      - name: Create release package
        shell: cmd
        run: |

          if exist release-package (
            rmdir /S /Q release-package
          )

          mkdir release-package
          mkdir release-package\plugins
          mkdir release-package\data
          mkdir release-package\data\dfzh

          set "FOUND_DLL="

          for /r "dfhack\build" %%F in (dfzh.plug.dll) do (
            if not defined FOUND_DLL (
              set "FOUND_DLL=%%F"
              copy /Y "%%F" "release-package\plugins\dfzh.plug.dll"
            )
          )

          if not defined FOUND_DLL (
            echo ERROR: dfzh.plug.dll was not found
            exit /b 1
          )

          xcopy /E /I /Y ^
            dfzh-source\data\* ^
            release-package\data\dfzh\

          echo.
          echo ========================================
          echo Release package
          echo ========================================

          dir /s /b release-package


      # ============================================================
      # 15. Upload artifact
      # ============================================================
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package
          if-no-files-found: error
