name: Build DFZH-AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout DFZH-AI source
      # ============================================================
      - name: Checkout dfzh source
        uses: actions/checkout@v4
        with:
          path: dfzh-source


      # ============================================================
      # 2. Checkout DFHack 53.06-r1
      # ============================================================
      - name: Checkout DFHack source
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            --branch %DFHACK_VERSION% ^
            --recurse-submodules ^
            --shallow-submodules ^
            https://github.com/DFHack/dfhack.git ^
            dfhack


      # ============================================================
      # 3. Verify DFHack submodules
      # ============================================================
      - name: Verify DFHack submodules
        shell: cmd
        run: |
          cd dfhack

          echo ========================================
          echo DFHack commit
          echo ========================================

          git rev-parse HEAD

          echo.
          echo ========================================
          echo Submodule status
          echo ========================================

          git submodule status

          echo.
          echo ========================================
          echo Checking required directories
          echo ========================================

          if not exist depends\dfhooks\CMakeLists.txt (
            echo ERROR: dfhooks submodule is missing.
            exit /b 1
          )

          if not exist depends\googletest\CMakeLists.txt (
            echo ERROR: googletest submodule is missing.
            exit /b 1
          )

          if not exist depends\jsoncpp-sub\CMakeLists.txt (
            echo ERROR: jsoncpp submodule is missing.
            exit /b 1
          )

          if not exist depends\clsocket\CMakeLists.txt (
            echo ERROR: clsocket submodule is missing.
            exit /b 1
          )

          if not exist depends\libzip\CMakeLists.txt (
            echo ERROR: libzip submodule is missing.
            exit /b 1
          )

          if not exist depends\xlsxio\CMakeLists.txt (
            echo ERROR: xlsxio submodule is missing.
            exit /b 1
          )

          if not exist depends\libexpat\expat (
            echo ERROR: libexpat submodule is missing.
            exit /b 1
          )

          if not exist scripts\CMakeLists.txt (
            echo ERROR: DFHack scripts directory is missing.
            exit /b 1
          )

          echo.
          echo All required DFHack submodules are present.


      # ============================================================
      # 4. Check Visual Studio / MSBuild
      # ============================================================
      - name: Check Visual Studio
        shell: cmd
        run: |
          echo ========================================
          echo Visual Studio
          echo ========================================

          where vswhere

          echo.
          echo Installed Visual Studio:

          vswhere -latest ^
            -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath

          echo.
          echo MSBuild:

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          if not defined VS_PATH (
            echo ERROR: Visual Studio installation not found.
            exit /b 1
          )

          echo VS_PATH=%VS_PATH%

          if not exist "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" (
            echo ERROR: MSBuild.exe not found.
            exit /b 1
          )

          echo.
          echo MSBuild version:

          "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" -version


      # ============================================================
      # 5. Check MSVC
      # ============================================================
      - name: Check MSVC version
        shell: cmd
        run: |
          echo ========================================
          echo MSVC versions
          echo ========================================

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          dir /b "%VS_PATH%\VC\Tools\MSVC"

          echo.

          for /d %%D in ("%VS_PATH%\VC\Tools\MSVC\*") do (
            echo ----------------------------------------
            echo %%D
            "%%D\bin\Hostx64\x64\cl.exe" 2>&1
          )


      # ============================================================
      # 6. Install vcpkg
      # ============================================================
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone ^
            --depth 1 ^
            https://github.com/microsoft/vcpkg.git ^
            vcpkg

          cd vcpkg

          call bootstrap-vcpkg.bat


      # ============================================================
      # 7. Cache vcpkg
      # ============================================================
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-dfzh-${{ runner.os }}-x64-${{ github.run_id }}
          restore-keys: |
            vcpkg-dfzh-${{ runner.os }}-x64-


      # ============================================================
      # 8. Install DFZH dependencies
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          cd vcpkg

          vcpkg install ^
            detours:x64-windows ^
            spdlog:x64-windows ^
            tomlplusplus:x64-windows


      # ============================================================
      # 9. Extract DFZH data.zip
      # ============================================================
      - name: Extract data.zip
        shell: cmd
        run: |
          cd dfzh-source

          tar -xf data.zip


      # ============================================================
      # 10. Install DFZH as an external DFHack plugin
      #
      # IMPORTANT:
      #
      # DFHack 53.06-r1 expects external plugins under:
      #
      #   plugins/external/
      #
      # The previous workflow incorrectly copied DFZH to:
      #
      #   plugins/df_chinese/
      #
      # which is NOT automatically registered.
      # ============================================================
      - name: Copy dfzh to DFHack external plugins
        shell: cmd
        run: |

          if not exist dfhack\plugins\external mkdir dfhack\plugins\external

          if exist dfhack\plugins\external\dfzh (
            rmdir /S /Q dfhack\plugins\external\dfzh
          )

          mkdir dfhack\plugins\external\dfzh

          echo ========================================
          echo Copy CMakeLists.txt
          echo ========================================

          copy /Y ^
            dfzh-source\CMakeLists.txt ^
            dfhack\plugins\external\dfzh\CMakeLists.txt

          echo.
          echo ========================================
          echo Copy source
          echo ========================================

          xcopy /E /I /Y ^
            dfzh-source\dfzh ^
            dfhack\plugins\external\dfzh\dfzh

          echo.
          echo ========================================
          echo Copy data
          echo ========================================

          xcopy /E /I /Y ^
            dfzh-source\data ^
            dfhack\plugins\external\dfzh\data

          echo.
          echo ========================================
          echo Copy 3rdParty
          echo ========================================

          xcopy /E /I /Y ^
            dfzh-source\3rdParty ^
            dfhack\plugins\external\dfzh\3rdParty


      # ============================================================
      # 11. Verify DFZH external plugin
      # ============================================================
      - name: Verify dfzh external plugin
        shell: cmd
        run: |

          echo ========================================
          echo DFZH external plugin
          echo ========================================

          dir /s /b dfhack\plugins\external\dfzh

          echo.
          echo ========================================
          echo DFZH CMakeLists.txt
          echo ========================================

          type dfhack\plugins\external\dfzh\CMakeLists.txt


      # ============================================================
      # 12. Show external plugin CMakeLists
      # ============================================================
      - name: Check external plugin registration
        shell: cmd
        run: |

          echo ========================================
          echo External plugin directory
          echo ========================================

          dir /b dfhack\plugins\external

          echo.
          echo ========================================
          echo Existing external CMakeLists
          echo ========================================

          if exist dfhack\plugins\external\CMakeLists.txt (
            type dfhack\plugins\external\CMakeLists.txt
          ) else (
            echo CMakeLists.txt does not exist yet.
            echo DFHack will generate it during CMake configure.
          )


      # ============================================================
      # 13. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: cmd
        run: |

          cd dfhack

          if exist build (
            rmdir /S /Q build
          )

          mkdir build

          cd build

          cmake .. ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=..\..\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF


      # ============================================================
      # 14. Verify DFZH project was generated
      # ============================================================
      - name: Verify generated dfzh project
        shell: cmd
        run: |

          echo ========================================
          echo Looking for dfzh.vcxproj
          echo ========================================

          dir /s /b dfhack\build\dfzh.vcxproj 2>nul

          echo.
          echo ========================================
          echo All dfzh related projects
          echo ========================================

          dir /s /b dfhack\build\*dfzh*.vcxproj 2>nul

          echo.
          echo ========================================
          echo External plugin projects
          echo ========================================

          dir /s /b dfhack\build\plugins\external\*.vcxproj 2>nul


      # ============================================================
      # 15. Build DFZH
      # ============================================================
      - name: Build dfzh
        shell: cmd
        run: |

          cd dfhack\build

          cmake --build . ^
            --config Release ^
            --target dfzh ^
            -- /m


      # ============================================================
      # 16. Find DFZH DLL
      # ============================================================
      - name: Find DFZH DLL
        shell: cmd
        run: |

          echo ========================================
          echo Searching for dfzh.plug.dll
          echo ========================================

          dir /s /b dfhack\build\dfzh.plug.dll 2>nul

          echo.
          echo ========================================
          echo All DLL files
          echo ========================================

          dir /s /b dfhack\build\*.dll


      # ============================================================
      # 17. Create release package
      # ============================================================
      - name: Create release package
        shell: cmd
        run: |

          if exist release-package (
            rmdir /S /Q release-package
          )

          mkdir release-package
          mkdir release-package\plugins
          mkdir release-package\data
          mkdir release-package\data\dfzh

          echo ========================================
          echo Copying dfzh.plug.dll
          echo ========================================

          set "FOUND_DLL="

          for /r "dfhack\build" %%F in (dfzh.plug.dll) do (
            if not defined FOUND_DLL (
              set "FOUND_DLL=%%F"
              copy /Y "%%F" "release-package\plugins\dfzh.plug.dll"
            )
          )

          if not defined FOUND_DLL (
            echo ERROR: dfzh.plug.dll was not found.
            exit /b 1
          )

          echo.
          echo ========================================
          echo Copying DFZH data
          echo ========================================

          xcopy /E /I /Y ^
            dfzh-source\data\* ^
            release-package\data\dfzh\

          echo.
          echo ========================================
          echo Release package
          echo ========================================

          dir /s /b release-package


      # ============================================================
      # 18. Upload release package
      # ============================================================
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package
          if-no-files-found: error
