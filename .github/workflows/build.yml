name: Build DFZH-AI

on:
  push:
    branches: [main]

  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout DFZH-AI source
      # ============================================================

      - name: Checkout DFZH-AI source
        uses: actions/checkout@v4
        with:
          path: dfzh-source


      # ============================================================
      # 2. Checkout exact DFHack version
      # ============================================================

      - name: Checkout DFHack source
        shell: cmd
        run: |

          git clone ^
            --depth 1 ^
            --branch %DFHACK_VERSION% ^
            --recurse-submodules ^
            --shallow-submodules ^
            https://github.com/DFHack/dfhack.git ^
            dfhack

          if not exist "dfhack\CMakeLists.txt" (
            echo ERROR: DFHack source was not downloaded correctly
            exit /b 1
          )

          echo.
          echo ========================================
          echo DFHack version
          echo ========================================

          cd dfhack

          git rev-parse HEAD
          git describe --tags --always

          cd ..


      # ============================================================
      # 3. Verify DFHack dependencies
      # ============================================================

      - name: Verify DFHack dependencies
        shell: cmd
        run: |

          echo ========================================
          echo Checking DFHack submodules
          echo ========================================

          if not exist "dfhack\depends\dfhooks\CMakeLists.txt" (
            echo ERROR: dfhooks missing
            exit /b 1
          )

          if not exist "dfhack\depends\googletest\CMakeLists.txt" (
            echo ERROR: googletest missing
            exit /b 1
          )

          if not exist "dfhack\depends\jsoncpp-sub\CMakeLists.txt" (
            echo ERROR: jsoncpp missing
            exit /b 1
          )

          if not exist "dfhack\depends\clsocket\CMakeLists.txt" (
            echo ERROR: clsocket missing
            exit /b 1
          )

          if not exist "dfhack\depends\libzip\CMakeLists.txt" (
            echo ERROR: libzip missing
            exit /b 1
          )

          if not exist "dfhack\depends\xlsxio\CMakeLists.txt" (
            echo ERROR: xlsxio missing
            exit /b 1
          )

          if not exist "dfhack\depends\libexpat\expat" (
            echo ERROR: libexpat missing
            exit /b 1
          )

          echo.
          echo DFHack dependencies OK.


      # ============================================================
      # 4. Install vcpkg
      # ============================================================

      - name: Install vcpkg
        shell: cmd
        run: |

          echo ========================================
          echo Installing vcpkg
          echo ========================================

          git clone ^
            https://github.com/microsoft/vcpkg.git ^
            vcpkg

          cd vcpkg

          call bootstrap-vcpkg.bat -disableMetrics

          if not exist vcpkg.exe (
            echo ERROR: vcpkg.exe was not created
            exit /b 1
          )

          vcpkg version

          cd ..


      # ============================================================
      # 5. Cache DFZH vcpkg dependencies
      # ============================================================

      - name: Cache DFZH vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            dfzh-source/3rdParty/vcpkg_installed
            vcpkg/downloads
            vcpkg/buildtrees
          key: dfzh-vcpkg-${{ runner.os }}-${{ hashFiles('dfzh-source/3rdParty/vcpkg.json') }}
          restore-keys: |
            dfzh-vcpkg-${{ runner.os }}-


      # ============================================================
      # 6. Install DFZH dependencies
      # ============================================================

      - name: Install DFZH dependencies
        shell: cmd
        run: |

          cd dfzh-source\3rdParty

          echo ========================================
          echo DFZH vcpkg manifest
          echo ========================================

          type vcpkg.json

          echo.
          echo ========================================
          echo Installing dependencies
          echo ========================================

          ..\..\vcpkg\vcpkg.exe install ^
            --triplet x64-windows ^
            --disable-metrics

          if not exist "vcpkg_installed\x64-windows\include" (
            echo ERROR: vcpkg dependencies were not installed
            exit /b 1
          )

          echo.
          echo ========================================
          echo Installed packages
          echo ========================================

          dir /b vcpkg_installed\x64-windows

          cd ..\..



      # ============================================================
      # 7. Extract data.zip
      # ============================================================

      - name: Extract data.zip
        shell: cmd
        run: |

          cd dfzh-source

          echo ========================================
          echo Extracting data.zip
          echo ========================================

          if not exist "data.zip" (
            echo ERROR: data.zip not found
            exit /b 1
          )

          tar -xf data.zip

          if not exist "data" (
            echo ERROR: data directory was not extracted
            exit /b 1
          )

          echo.
          echo DFZH data extracted successfully.

          cd ..



      # ============================================================
      # 8. Copy DFZH into DFHack external plugin tree
      # ============================================================

      - name: Copy DFZH to DFHack
        shell: cmd
        run: |

          echo ========================================
          echo Preparing DFZH external plugin
          echo ========================================

          if exist "dfhack\plugins\external\dfzh" (
            rmdir /S /Q "dfhack\plugins\external\dfzh"
          )

          mkdir "dfhack\plugins\external\dfzh"

          copy /Y ^
            "dfzh-source\CMakeLists.txt" ^
            "dfhack\plugins\external\dfzh\CMakeLists.txt"

          xcopy /E /I /Y ^
            "dfzh-source\dfzh" ^
            "dfhack\plugins\external\dfzh\dfzh"

          xcopy /E /I /Y ^
            "dfzh-source\data" ^
            "dfhack\plugins\external\dfzh\data"

          xcopy /E /I /Y ^
            "dfzh-source\3rdParty" ^
            "dfhack\plugins\external\dfzh\3rdParty"



      # ============================================================
      # 9. Verify DFZH source
      # ============================================================

      - name: Verify DFZH source
        shell: cmd
        run: |

          echo ========================================
          echo Checking DFZH source
          echo ========================================

          if not exist "dfhack\plugins\external\dfzh\CMakeLists.txt" (
            echo ERROR: DFZH CMakeLists.txt missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\dfzh\dfzh.cpp" (
            echo ERROR: dfzh.cpp missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\dfzh\ttf_manager.cpp" (
            echo ERROR: ttf_manager.cpp missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\dfzh\ai_translator.cpp" (
            echo ERROR: ai_translator.cpp missing
            exit /b 1
          )

          echo.
          echo DFZH source OK.



      # ============================================================
      # 10. Verify DFZH dependencies
      # ============================================================

      - name: Verify DFZH dependencies
        shell: cmd
        run: |

          echo ========================================
          echo Checking DFZH dependencies
          echo ========================================

          set "VCPKG_ROOT=dfhack\plugins\external\dfzh\3rdParty\vcpkg_installed\x64-windows"

          if not exist "%VCPKG_ROOT%\include" (
            echo ERROR: DFZH vcpkg include directory missing
            exit /b 1
          )

          if not exist "%VCPKG_ROOT%\include\detours\detours.h" (
            echo ERROR: Detours headers missing
            exit /b 1
          )

          if not exist "%VCPKG_ROOT%\include\spdlog\spdlog.h" (
            echo ERROR: spdlog headers missing
            exit /b 1
          )

          if not exist "%VCPKG_ROOT%\include\toml++\toml.hpp" (
            echo ERROR: toml++ headers missing
            exit /b 1
          )

          if not exist "dfhack\plugins\external\dfzh\3rdParty\cpp-httplib\httplib.h" (
            echo ERROR: cpp-httplib missing
            exit /b 1
          )

          echo.
          echo DFZH dependencies OK.



      # ============================================================
      # 11. Configure CMake
      # ============================================================

      - name: Configure CMake
        shell: cmd
        run: |

          echo ========================================
          echo Configuring CMake
          echo ========================================

          cd dfhack

          if exist build (
            rmdir /S /Q build
          )

          mkdir build

          cd build

          cmake .. ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF



      # ============================================================
      # 12. Verify generated DFZH project
      # ============================================================

      - name: Verify generated DFZH project
        shell: cmd
        run: |

          echo ========================================
          echo Checking generated DFZH project
          echo ========================================

          if not exist "dfhack\build\plugins\external\dfzh\dfzh.vcxproj" (
            echo ERROR: dfzh.vcxproj was not generated
            exit /b 1
          )

          echo.
          echo DFZH project generated successfully.



      # ============================================================
      # 13. Build DFZH
      # ============================================================

      - name: Build DFZH
        shell: cmd
        run: |

          echo ========================================
          echo Building DFZH
          echo ========================================

          cd dfhack\build

          cmake --build . ^
            --config Release ^
            --target dfzh ^
            -- /m

          if errorlevel 1 (
            echo ERROR: DFZH build failed
            exit /b 1
          )

          echo.
          echo DFZH build completed successfully.



      # ============================================================
      # 14. Locate DFZH DLL
      # ============================================================

      - name: Locate DFZH DLL
        shell: cmd
        run: |

          echo ========================================
          echo Searching for DFZH DLL
          echo ========================================

          dir /s /b ^
            "dfhack\build\dfzh.plug.dll" ^
            2>nul

          dir /s /b ^
            "dfhack\build\*.plug.dll" ^
            2>nul

          echo.
          echo Expected location:

          if not exist "dfhack\build\plugins\external\dfzh\Release\dfzh.plug.dll" (
            echo ERROR: DFZH DLL not found
            exit /b 1
          )

          echo.
          echo DFZH DLL found:

          dir ^
            "dfhack\build\plugins\external\dfzh\Release\dfzh.plug.dll"



      # ============================================================
      # 15. Verify SDL2_ttf
      #
      # IMPORTANT:
      # The actual location is inside the copied DFHack tree.
      # ============================================================

      - name: Verify SDL2_ttf
        shell: cmd
        run: |

          echo ========================================
          echo Searching for SDL2_ttf.dll
          echo ========================================

          set "SDL2_TTF_DLL=dfhack\plugins\external\dfzh\3rdParty\SDL2_ttf\SDL2_ttf-2.24.0\lib\x64\SDL2_ttf.dll"

          if not exist "%SDL2_TTF_DLL%" (
            echo.
            echo ERROR: SDL2_ttf.dll was not found.
            echo.
            echo Searching entire workspace:
            dir /s /b "*.dll"
            exit /b 1
          )

          echo.
          echo SDL2_ttf.dll found successfully:

          dir "%SDL2_TTF_DLL%"



      # ============================================================
      # 16. Inspect DFZH DLL dependencies
      #
      # Use Visual Studio dumpbin.
      # This tells us exactly which DLLs dfzh.plug.dll imports.
      # ============================================================

      - name: Inspect DFZH DLL dependencies
        shell: cmd
        run: |

          echo ========================================
          echo Inspecting DFZH DLL dependencies
          echo ========================================

          set "DFZH_DLL=dfhack\build\plugins\external\dfzh\Release\dfzh.plug.dll"

          if not exist "%DFZH_DLL%" (
            echo ERROR: DFZH DLL not found
            exit /b 1
          )

          echo.
          echo Initializing Visual Studio environment...

          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          if errorlevel 1 (
            echo Enterprise VS environment unavailable.
            echo Trying Community...
            call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          )

          echo.
          echo ========================================
          echo DUMPBIN /DEPENDENTS
          echo ========================================

          where dumpbin

          if errorlevel 1 (
            echo ERROR: dumpbin.exe not found
            exit /b 1
          )

          dumpbin /DEPENDENTS "%DFZH_DLL%"



      # ============================================================
      # 17. Create release package
      #
      # Final layout:
      #
      # Dwarf Fortress/
      #
      #   SDL2_ttf.dll
      #
      #   hack/
      #     plugins/
      #       dfzh.plug.dll
      #
      #     data/
      #       dfzh/
      #
      # ============================================================

      - name: Create release package
        shell: cmd
        run: |

          echo ========================================
          echo Creating release package
          echo ========================================

          if exist "release-package" (
            rmdir /S /Q "release-package"
          )

          mkdir "release-package"
          mkdir "release-package\hack"
          mkdir "release-package\hack\plugins"
          mkdir "release-package\hack\data"
          mkdir "release-package\hack\data\dfzh"



      # ============================================================
      # 18. Copy DFZH plugin
      # ============================================================

      - name: Copy DFZH plugin
        shell: cmd
        run: |

          echo ========================================
          echo Copying DFZH plugin
          echo ========================================

          set "DFZH_DLL=dfhack\build\plugins\external\dfzh\Release\dfzh.plug.dll"

          if not exist "%DFZH_DLL%" (
            echo ERROR: DFZH DLL not found
            exit /b 1
          )

          copy /Y ^
            "%DFZH_DLL%" ^
            "release-package\hack\plugins\dfzh.plug.dll"

          if not exist "release-package\hack\plugins\dfzh.plug.dll" (
            echo ERROR: DFZH DLL was not copied
            exit /b 1
          )

          echo.
          echo DFZH DLL copied successfully.



      # ============================================================
      # 19. Copy SDL2_ttf.dll
      # ============================================================

      - name: Copy SDL2_ttf.dll
        shell: cmd
        run: |

          echo ========================================
          echo Copying SDL2_ttf.dll
          echo ========================================

          set "SDL2_TTF_DLL=dfhack\plugins\external\dfzh\3rdParty\SDL2_ttf\SDL2_ttf-2.24.0\lib\x64\SDL2_ttf.dll"

          if not exist "%SDL2_TTF_DLL%" (
            echo ERROR: SDL2_ttf.dll not found
            exit /b 1
          )

          copy /Y ^
            "%SDL2_TTF_DLL%" ^
            "release-package\SDL2_ttf.dll"

          if not exist "release-package\SDL2_ttf.dll" (
            echo ERROR: SDL2_ttf.dll was not copied
            exit /b 1
          )

          echo.
          echo SDL2_ttf.dll copied successfully.

          dir "release-package\SDL2_ttf.dll"



      # ============================================================
      # 20. Copy DFZH data
      # ============================================================

      - name: Copy DFZH data
        shell: cmd
        run: |

          echo ========================================
          echo Copying DFZH data
          echo ========================================

          xcopy /E /I /Y ^
            "dfzh-source\data\*" ^
            "release-package\hack\data\dfzh\"

          if errorlevel 1 (
            echo ERROR: Failed to copy DFZH data
            exit /b 1
          )

          echo.
          echo DFZH data copied successfully.



      # ============================================================
      # 21. Final package verification
      # ============================================================

      - name: Verify final package
        shell: cmd
        run: |

          echo ========================================
          echo FINAL PACKAGE
          echo ========================================

          echo.
          echo Package contents:

          dir /s /b "release-package"

          echo.
          echo ========================================
          echo Required files
          echo ========================================

          if not exist "release-package\SDL2_ttf.dll" (
            echo ERROR: SDL2_ttf.dll missing
            exit /b 1
          )

          if not exist "release-package\hack\plugins\dfzh.plug.dll" (
            echo ERROR: dfzh.plug.dll missing
            exit /b 1
          )

          if not exist "release-package\hack\data\dfzh" (
            echo ERROR: DFZH data directory missing
            exit /b 1
          )

          echo.
          echo ========================================
          echo REQUIRED FILES OK
          echo ========================================

          echo.
          echo SDL2_ttf.dll:
          dir "release-package\SDL2_ttf.dll"

          echo.
          echo DFZH plugin:
          dir "release-package\hack\plugins\dfzh.plug.dll"



      # ============================================================
      # 22. Upload artifact
      # ============================================================

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package
          if-no-files-found: error
