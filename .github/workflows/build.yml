name: Build DFZH-AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DFHACK_VERSION: "53.06-r1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. Checkout DFZH source
      # ============================================================
      - name: Checkout dfzh source
        uses: actions/checkout@v4
        with:
          path: dfzh-source

      # ============================================================
      # 2. Checkout DFHack 53.06-r1
      # ============================================================
      - name: Checkout DFHack source
        shell: cmd
        run: |
          git clone --depth 1 --branch %DFHACK_VERSION% https://github.com/DFHack/dfhack.git dfhack

      # ============================================================
      # 3. Initialize DFHack submodule
      # ============================================================
      - name: Init DFHack submodules
        shell: cmd
        run: |
          cd dfhack
          git submodule update --init --depth 1 library/xml

      # ============================================================
      # 4. Locate Visual Studio
      # ============================================================
      - name: Locate Visual Studio
        shell: cmd
        run: |
          echo ========================================
          echo Visual Studio
          echo ========================================

          where vswhere

          echo.
          echo Installation path:

          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          if not defined VS_PATH (
            echo ERROR: Visual Studio installation not found.
            exit /b 1
          )

          echo %VS_PATH%

          echo.
          echo MSBuild:

          if exist "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" (
            echo %VS_PATH%\MSBuild\Current\Bin\MSBuild.exe
          ) else (
            echo ERROR: MSBuild.exe not found.
            exit /b 1
          )

      # ============================================================
      # 5. Install current vcpkg
      # ============================================================
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          call bootstrap-vcpkg.bat

      # ============================================================
      # 6. Cache vcpkg
      # ============================================================
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-dfzh-${{ runner.os }}-x64-${{ github.run_id }}
          restore-keys: |
            vcpkg-dfzh-${{ runner.os }}-x64-

      # ============================================================
      # 7. Install DFZH dependencies
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          cd vcpkg

          vcpkg install ^
            detours:x64-windows ^
            spdlog:x64-windows ^
            tomlplusplus:x64-windows

      # ============================================================
      # 8. Prepare DFZH vcpkg dependencies
      # ============================================================
      - name: Prepare dfzh dependencies
        shell: cmd
        run: |
          if not exist dfzh-source\3rdParty mkdir dfzh-source\3rdParty

          if not exist dfzh-source\3rdParty\vcpkg_installed mkdir dfzh-source\3rdParty\vcpkg_installed

          xcopy /E /I /Y vcpkg\installed\* dfzh-source\3rdParty\vcpkg_installed\

      # ============================================================
      # 9. Extract data.zip
      # ============================================================
      - name: Extract data.zip
        shell: cmd
        run: |
          cd dfzh-source
          tar -xf data.zip

      # ============================================================
      # 10. Copy DFZH into DFHack
      # ============================================================
      - name: Copy dfzh to DFHack
        shell: cmd
        run: |
          if not exist dfhack\plugins\df_chinese mkdir dfhack\plugins\df_chinese

          copy /Y dfzh-source\CMakeLists.txt dfhack\plugins\df_chinese\CMakeLists.txt

          xcopy /E /I /Y dfzh-source\dfzh dfhack\plugins\df_chinese\dfzh

          xcopy /E /I /Y dfzh-source\data dfhack\plugins\df_chinese\data

          xcopy /E /I /Y dfzh-source\3rdParty dfhack\plugins\df_chinese\3rdParty

      # ============================================================
      # 11. Verify source
      # ============================================================
      - name: Verify plugin source
        shell: cmd
        run: |
          echo ========================================
          echo DFZH plugin source
          echo ========================================

          dir /s /b dfhack\plugins\df_chinese

      # ============================================================
      # 12. Configure CMake
      #
      # windows-latest currently uses Visual Studio 18.
      # Do not hard-code the VS 2022 generator.
      # ============================================================
      - name: Configure CMake
        shell: cmd
        run: |
          cd dfhack

          if exist build rmdir /S /Q build

          mkdir build
          cd build

          cmake .. ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=..\..\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_DFHACK_DOCUMENTATION=OFF ^
            -DBUILD_DFHACK_LAUNCHER=OFF

      # ============================================================
      # 13. Build DFZH
      # ============================================================
      - name: Build dfzh
        shell: cmd
        run: |
          cd dfhack\build

          cmake --build . ^
            --config Release ^
            --target dfzh ^
            -- /m

      # ============================================================
      # 14. Find DFZH DLL
      # ============================================================
      - name: Find DFZH DLL
        shell: cmd
        run: |
          echo ========================================
          echo Searching for dfzh.plug.dll
          echo ========================================

          dir /s /b dfhack\build\dfzh.plug.dll 2>nul
          dir /s /b dfhack\build\plugins\dfzh.plug.dll 2>nul
          dir /s /b dfhack\build\plugins\df_chinese\dfzh.plug.dll 2>nul

          echo.
          echo ========================================
          echo All DLL files
          echo ========================================

          dir /s /b dfhack\build\*.dll

      # ============================================================
      # 15. Create release package
      # ============================================================
      - name: Create release package
        shell: cmd
        run: |
          mkdir release-package
          mkdir release-package\plugins
          mkdir release-package\data
          mkdir release-package\data\dfzh

          echo ========================================
          echo Copying DFZH DLL
          echo ========================================

          set "FOUND_DLL="

          for /r "dfhack\build" %%F in (dfzh.plug.dll) do (
            if not defined FOUND_DLL (
              set "FOUND_DLL=%%F"
              copy /Y "%%F" "release-package\plugins\dfzh.plug.dll"
            )
          )

          if not defined FOUND_DLL (
            echo ERROR: dfzh.plug.dll was not found.
            exit /b 1
          )

          echo.
          echo ========================================
          echo Copying DFZH data
          echo ========================================

          xcopy /E /I /Y dfzh-source\data\* release-package\data\dfzh\

          echo.
          echo ========================================
          echo Release package
          echo ========================================

          dir /s /b release-package

      # ============================================================
      # 16. Upload artifact
      # ============================================================
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package
          if-no-files-found: error
