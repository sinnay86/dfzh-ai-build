name: Build DFZH-AI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dfzh source
        uses: actions/checkout@v4
        path: dfzh-source

      - name: Checkout DFHack source
        run: git clone --depth 1 --branch 53.06-r1 https://github.com/DFHack/dfhack.git
        shell: cmd

      - name: Init DFHack submodules
        run: cd dfhack && git submodule update --init --depth 1 library/xml
        shell: cmd

      - name: Install vcpkg
        run: git clone --depth 1 --branch 2024.07.12 https://github.com/microsoft/vcpkg.git && cd vcpkg && call bootstrap-vcpkg.bat
        shell: cmd

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-dfzh-2024.07.12

      - name: Install dependencies
        run: cd vcpkg && vcpkg install detours:x64-windows spdlog:x64-windows tomlplusplus:x64-windows
        shell: cmd

      - name: Extract data.zip
        run: cd dfzh-source && tar -xf data.zip
        shell: cmd

      - name: Copy dfzh to DFHack
        run: xcopy /E /I /Y dfzh-source\CMakeLists.txt dfhack\plugins\df_chinese\CMakeLists.txt && xcopy /E /I /Y dfzh-source\dfzh dfhack\plugins\df_chinese\dfzh && xcopy /E /I /Y dfzh-source\data dfhack\plugins\df_chinese\data && xcopy /E /I /Y dfzh-source\3rdParty dfhack\plugins\df_chinese\3rdParty
        shell: cmd

      - name: Configure CMake
        run: cd dfhack && mkdir build && cd build && cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=..\..\vcpkg\scripts\buildsystems\vcpkg.cmake -DBUILD_DFHACK_DOCUMENTATION=OFF -DBUILD_DFHACK_LAUNCHER=OFF
        shell: cmd

      - name: Build dfzh
        run: cd dfhack\build && cmake --build . --config Release --target dfzh -- /m
        shell: cmd

      - name: Find DLL
        run: dir /s /b dfhack\build\plugins\*.dll
        shell: cmd

      - name: Create release package
        run: mkdir release-package\plugins && mkdir release-package\data\dfzh && copy /Y dfhack\build\plugins\df_chinese\Release\dfzh.plug.dll release-package\plugins\ && xcopy /E /I /Y dfzh-source\data\* release-package\data\dfzh\
        shell: cmd

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: dfzh-ai-release-package
          path: release-package/**
